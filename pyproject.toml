[project]
name = "network-cpt-data"
version = "0.1.0"
description = "Separate network CPT and agentic SFT data preparation pipelines"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub>=0.30,<2",
    "pyarrow>=18,<24",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
pdf = ["docling>=2.60,<3"]
sft = ["transformers>=4.51,<6"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["network_cpt", "network_sft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
