# Replace YOUR_PROJECT_ID, YOUR_REGION, YOUR_REPOSITORY, and both bucket names.
# Network names must match the A3 Mega multi-network configuration in your cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpt-a3mega
  annotations:
    iam.gke.io/gcp-service-account: cpt-a3mega@YOUR_PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: cpt-a3mega-70b
spec:
  failurePolicy:
    maxRestarts: 2
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
    subdomain: cpt-a3mega-70b
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          completionMode: Indexed
          completions: 2
          parallelism: 2
          backoffLimit: 0
          template:
            metadata:
              labels:
                app: cpt-a3mega-70b
                tcpxo: daemon
              annotations:
                gke-gcsfuse/volumes: "true"
                devices.gke.io/container.tcpxo-daemon: |+
                  - path: /dev/nvidia0
                  - path: /dev/nvidia1
                  - path: /dev/nvidia2
                  - path: /dev/nvidia3
                  - path: /dev/nvidia4
                  - path: /dev/nvidia5
                  - path: /dev/nvidia6
                  - path: /dev/nvidia7
                  - path: /dev/nvidiactl
                  - path: /dev/nvidia-uvm
                  - path: /dev/dmabuf_import_helper
                networking.gke.io/default-interface: "eth0"
                networking.gke.io/interfaces: |
                  [
                    {"interfaceName":"eth0","network":"default"},
                    {"interfaceName":"eth1","network":"vpc1"},
                    {"interfaceName":"eth2","network":"vpc2"},
                    {"interfaceName":"eth3","network":"vpc3"},
                    {"interfaceName":"eth4","network":"vpc4"},
                    {"interfaceName":"eth5","network":"vpc5"},
                    {"interfaceName":"eth6","network":"vpc6"},
                    {"interfaceName":"eth7","network":"vpc7"},
                    {"interfaceName":"eth8","network":"vpc8"}
                  ]
            spec:
              serviceAccountName: cpt-a3mega
              restartPolicy: Never
              terminationGracePeriodSeconds: 180
              nodeSelector:
                cloud.google.com/gke-accelerator: nvidia-h100-mega-80gb
                node.kubernetes.io/instance-type: a3-megagpu-8g
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          app: cpt-a3mega-70b
                      topologyKey: kubernetes.io/hostname
              containers:
                - name: tcpxo-daemon
                  image: us-docker.pkg.dev/gce-ai-infra/gpudirect-tcpxo/tcpgpudmarxd-dev:v1.0.23
                  imagePullPolicy: Always
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -ex
                      chmod 755 /fts/entrypoint_rxdm_container.sh
                      exec /fts/entrypoint_rxdm_container.sh --num_hops=2
                  securityContext:
                    capabilities:
                      add:
                        - NET_ADMIN
                        - NET_BIND_SERVICE
                  env:
                    - name: LD_LIBRARY_PATH
                      value: /usr/local/nvidia/lib64
                  volumeMounts:
                    - name: nvidia
                      mountPath: /usr/local/nvidia/lib64
                    - name: sys
                      mountPath: /hostsysfs
                    - name: proc-sys
                      mountPath: /hostprocsysfs

                - name: trainer
                  # Reuses the dependency-only image from gke_a3mega/Dockerfile.
                  image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_REPOSITORY/network-cpt:a3mega
                  imagePullPolicy: Always
                  command: ["/bin/bash", "-c"]
                  args:
                    - |
                      set -eo pipefail
                      export MASTER_ADDR="${JOBSET_NAME}-workers-0-0.${JOBSET_NAME}"
                      until getent hosts "${MASTER_ADDR}" >/dev/null; do sleep 2; done
                      export NCCL_LIB_DIR=/usr/local/nvidia/lib64
                      source "${NCCL_LIB_DIR}/nccl-env-profile.sh"
                      set -u
                      sleep 10
                      exec accelerate launch \
                        --config_file /workspace/code/fsdp_config.yaml \
                        --num_machines 2 \
                        --num_processes 16 \
                        --machine_rank "${NODE_RANK}" \
                        --main_process_ip "${MASTER_ADDR}" \
                        --main_process_port 29500 \
                        /workspace/code/train_cpt.py
                  env:
                    - name: JOBSET_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
                    - name: NODE_RANK
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: hf-token
                          key: token
                    - name: CPT_DATA_DIR
                      value: /mnt/cpt-data
                    - name: CPT_OUTPUT_DIR
                      value: /mnt/cpt-output/llama-3.1-70b-instruct-qlora-fsdp
                    - name: HF_HOME
                      value: /cache/huggingface
                    - name: HF_DATASETS_CACHE
                      value: /cache/huggingface/datasets
                    - name: EXPECTED_WORLD_SIZE
                      value: "16"
                    - name: EXPECTED_LOCAL_WORLD_SIZE
                      value: "8"
                    - name: NCCL_DEBUG
                      value: WARN
                    - name: NCCL_DEBUG_SUBSYS
                      value: INIT,NET,ENV,COLL,GRAPH
                    - name: NCCL_FASTRAK_LLCM_DEVICE_DIRECTORY
                      value: /dev/aperture_devices
                    - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                      value: "1"
                  resources:
                    requests:
                      cpu: "150"
                      memory: 1000Gi
                      ephemeral-storage: 800Gi
                    limits:
                      nvidia.com/gpu: 8
                  volumeMounts:
                    - name: cpt-data
                      mountPath: /mnt/cpt-data
                      readOnly: true
                    - name: cpt-output
                      mountPath: /mnt/cpt-output
                    - name: hf-cache
                      mountPath: /cache
                    - name: cpt-code
                      mountPath: /workspace/code
                      readOnly: true
                    - name: shared-memory
                      mountPath: /dev/shm
                    - name: aperture-devices
                      mountPath: /dev/aperture_devices
              volumes:
                - name: cpt-data
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    readOnly: true
                    volumeAttributes:
                      bucketName: YOUR_CPT_DATA_BUCKET
                      mountOptions: implicit-dirs,only-dir=CPT_data
                - name: cpt-output
                  csi:
                    driver: gcsfuse.csi.storage.gke.io
                    volumeAttributes:
                      bucketName: YOUR_CPT_OUTPUT_BUCKET
                      mountOptions: implicit-dirs
                - name: hf-cache
                  emptyDir:
                    sizeLimit: 1200Gi
                - name: cpt-code
                  configMap:
                    name: cpt-a3mega-70b-code
                - name: shared-memory
                  emptyDir:
                    medium: Memory
                    sizeLimit: 64Gi
                - name: nvidia
                  hostPath:
                    path: /home/kubernetes/bin/nvidia/lib64
                - name: sys
                  hostPath:
                    path: /sys
                - name: proc-sys
                  hostPath:
                    path: /proc/sys
                - name: aperture-devices
                  hostPath:
                    path: /dev/aperture_devices
